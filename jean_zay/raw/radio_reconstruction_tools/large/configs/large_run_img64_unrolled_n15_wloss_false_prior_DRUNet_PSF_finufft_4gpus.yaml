# Production config: large_run_img64_unrolled_n15_wloss_false (A100, 4-GPU DDP).
# 15-layer unrolled net, DRUNet prior, greedy sequential training depth 2 -> 15.
#
# ABLATION vs large_run_img64_unrolled_n15_prior_DRUNet_PSF_finufft_4gpus.yaml:
# the ONLY difference is `model.weighted_loss: false` — each sequential stage is
# supervised on its FINAL layer alone (w_r = delta_{r,N-1}) instead of on every
# layer with increasing weight (w_r = 1/(N-r)). Everything else (data, UV bank,
# splits, noise, optimiser, schedule) is bit-identical to the weighted run, so
# the two are directly comparable. Keep the `_wloss_false` token in every name.
#
# Full TNG50 dataset; only n_train + n_val + n_test images are read from the
# directory (load is capped, no need to pre-subset). Runs under the A100 20h QoS
# with automatic resubmission (see the matching job in ../jobs/): each relaunch
# resumes from the last checkpoint.

model:
  type: unrolled_psf
  nlayers: 15
  alpha_mode: conv
  beta_mode: DRUNet
  train_denoiser: false
  weighted_loss: false   # supervise only the final layer of each stage (ablation)

optim:
  lr: 0.005
  lr_step_size: 50
  lr_gamma: 0.5
  epochs: 100            # epochs PER sequential stage
  batch_size: 8
  accumulate_grad_batches: 1
  effective_batch_size: 64

data:
  data_path: /lustre/fswork/projects/rech/uem/commun/datasets/ungridded_dataset
  img_size: 64
  n_train: 4000
  n_val: 500
  n_test: 500            # disjoint, held out (reserved for evaluation, not trained on)
  val_fraction: 0.2      # fallback only (ignored because n_val is set)
  augment: true
  # Pinned experiment condition — REUSED as-is from the weighted-loss campaign
  # (built 2026-07-17, provenance stamp backend=finufft / imaging_weights=briggs
  # / radio_tools 0.1.0, which is exactly what this run requests). Nothing here
  # depends on the loss weights, so the UV bank, splits, op-norms and PSF bank
  # are read-only for this run: no rebuild, and no cache ping-pong with the
  # weighted chain if both run concurrently. Do NOT point this at a fresh dir —
  # sharing the condition is what makes the ablation comparable.
  artifacts_dir: /lustre/fswork/projects/rech/ney/ulx23va/projects/radio/outputs/artifacts/large_img64_cov1000_ntrain4000_psf_finufft

operator:
  name: finufft
  kwargs: {}

uv:
  n_coverages: 1000
  obs_length_h: 1.0      # observation length in hours (longer -> more uv samples)
  time_delta_s: 300.0    # integration time per sample in seconds (smaller -> more uv samples)
  super_resolution: 1.5  # longest baseline lands at pi/super_resolution on the grid
  # Random pointing per coverage: declination [deg] and start hour angle [h]
  # are drawn uniformly from these ranges. Keep every 1h track above the
  # MeerKAT ~15 deg elevation limit: with the default obs_length_h the
  # rectangle dec [-80, 0] x ha [-4, +3] stays above 25 deg elevation and
  # roughly doubles the coverage-shape diversity; the northernmost dec sets
  # how far ha may stretch (see the elevation table in the docs). These
  # parameters are part of the pinned artifacts_dir condition.
  dec_range: [-45.0, 0.0]
  ha_range: [-4.0, 0.0]
  # Optional imaging-weight preconditioning of the physics: null (unweighted,
  # default), "uniform", or "briggs"/"robust". When set, per-coverage weights W
  # from radio_tools.gen_imaging_weights are folded into the operator (A -> W A),
  # visibilities are simulated as y = W(Ax + n) (noise on the raw visibilities,
  # weighting applied after), and the operator norms / PSF bank are computed for
  # the weighted operator. NOTE: this is part of the trained physics but is NOT
  # stored in the checkpoint — evaluate with the same --imaging-weights.
  imaging_weights: briggs

noise:
  add: true
  min: 10
  max: 40

sequential:
  enabled: true
  start_layers: 2

runtime:
  device: cuda
  devices: 4
  num_nodes: 1
  strategy: ddp          # explicit DDP; job must set ntasks-per-node=4
  num_workers: 8         # = cpus-per-task on an A100 eighth-node (64/8)
  seed: 0
  enable_progress_bar: false
  log_dir: /lustre/fswork/projects/rech/ney/ulx23va/projects/radio/outputs/trained_models
  run_name: null         # overridden by the job with a stable per-chain RUN_ID
  resume_from: null

wandb:
  enabled: true
  offline: true
  project: radio_reconstruction_tools
  entity: null
  name: null
