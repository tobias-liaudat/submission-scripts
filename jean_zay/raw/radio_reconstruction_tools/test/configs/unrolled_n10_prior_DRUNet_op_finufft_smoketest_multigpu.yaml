# Smoke-test config: unrolled net, DRUNet prior, finufft operator, 2-GPU DDP.
# Identical experiment condition to the single-GPU finufft smoke test (same
# shared artifacts_dir), but trains on 2 GPUs of one node with the DDP strategy
# to validate multi-GPU training end to end (rank-0-only artifact handling,
# distributed sampling, effective-batch-size accumulation, checkpointing).
# Run via the matching job script in ../jobs/ (ntasks-per-node must equal
# runtime.devices). Launch AFTER the artifact-creator smoke job (see
# submit_smoketests.sh): with the artifacts dir already populated, all ranks
# just load the stored condition.

model:
  type: unrolled         # NUFFT data-fidelity gradient A^H(y - A x)
  nlayers: 10
  alpha_mode: conv       # image-size-independent learned gradient step
  beta_mode: DRUNet      # pretrained DRUNet denoiser as the per-layer prox
  train_denoiser: false  # freeze DRUNet weights, learn only the per-layer noise level
  weighted_loss: true    # supervise every layer (later layers weighted more)

optim:
  lr: 0.005
  lr_step_size: 50
  lr_gamma: 0.5
  epochs: 2              # smoke test: just exercise train + val + checkpointing
  batch_size: 2
  # Exercise the new effective-batch-size resolution across devices:
  # accumulate = 16 / (batch 2 x 2 GPUs x 1 node) = 4 micro-batches per step.
  accumulate_grad_batches: 1  # ignored (effective_batch_size is set)
  effective_batch_size: 16

data:
  # Small symlink subset of the TNG50 ungridded dataset (32 images). The full
  # dataset (13400 images) lives at
  # /lustre/fswork/projects/rech/uem/commun/datasets/ungridded_dataset/ and is
  # loaded in full by load_image_dataset, so use the subset for the smoke test.
  data_path: /lustre/fswork/projects/rech/ney/ulx23va/projects/radio/datasets/ungridded_subset_smoketest_32
  img_size: 64
  n_train: 16
  n_val: 4
  val_fraction: 0.2
  augment: true
  # Shared smoke-test experiment condition (created by the finufft V100 smoke
  # job — launch that one first, e.g. via submit_smoketests.sh). Under DDP only
  # rank 0 would generate a missing condition (the other ranks wait for it),
  # but reusing the pre-built one keeps this run identical to the single-GPU
  # tests. The pinned uv/img_size/seed params must match the creator config.
  artifacts_dir: /lustre/fswork/projects/rech/ney/ulx23va/projects/radio/outputs/artifacts/smoketest_64px_cov4_ntrain16

operator:
  name: finufft          # pytorch_finufft NUFFT forward model (default backend)
  kwargs: {}

uv:
  n_coverages: 4
  obs_length_h: 0.2      # short observation -> few visibilities (fast smoke test)
  time_delta_s: 600.0
  super_resolution: 1.5  # longest baseline lands at pi/super_resolution on the grid
  imaging_weights: briggs  # Briggs/robust weighting folded into the operator (part of the trained physics; evaluate with the same setting)

noise:
  add: true
  min: 10
  max: 40

# --- Sequential / greedy layer-wise training -------------------------------
# Train progressively deeper nets (depths start_layers..model.nlayers), each
# warm-started from the previous stage; every stage saved under its own
# sub-directory and the schedule auto-resumes. The smoke test only validates the
# machinery, so it skips ahead to depth 8 -> 3 quick stages (8 -> 9 -> 10:
# one trained from scratch + two warm-started). For a production run set
# start_layers: 2 to greedily ramp from depth 2.
sequential:
  enabled: true
  start_layers: 8

runtime:
  device: cuda
  devices: 2             # 2 GPUs on one node; job must set ntasks-per-node=2
  num_nodes: 1
  strategy: ddp          # explicit DDP for multi-GPU
  num_workers: 8
  seed: 0
  enable_progress_bar: false
  log_dir: /lustre/fswork/projects/rech/ney/ulx23va/projects/radio/outputs/trained_models
  run_name: unrolled_n10_prior_DRUNet_op_finufft_multigpu
  resume_from: null

wandb:
  enabled: true
  offline: true          # no internet on compute nodes; `wandb sync` afterwards
  project: radio_reconstruction_tools
  entity: null
  name: null
